name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch Inno Setup compiler
        shell: powershell
        run: ./scripts/fetch-inno.ps1

      - name: Build
        shell: powershell
        run: dotnet build VoxLink.slnx -c Release

      - name: Test
        shell: powershell
        run: dotnet test VoxLink.slnx -c Release --no-build

      - name: Publish portable package and installer
        shell: powershell
        run: ./scripts/publish.ps1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoxLink-win-x64
          path: |
            artifacts/release/VoxLink-win-x64.zip
            artifacts/release/VoxLink-win-x64.zip.sha256
            artifacts/release/Setup-VoxLink-*.exe
            artifacts/release/Setup-VoxLink-*.exe.sha256
          if-no-files-found: error

      - name: Create GitHub Release (tagged builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem "artifacts/release" -File |
              Where-Object { $_.Name -match '\.(zip|sha256|exe)$' } |
              Select-Object -ExpandProperty FullName
          gh release create "$env:GITHUB_REF_NAME" $assets `
              --title "VoxLink $env:GITHUB_REF_NAME" `
              --notes "自动构建的便携包与安装包。"
